name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Physics regression tests
        run: npm test
      - name: Golden physics records (bit for bit)
        run: npm run golden
      - name: Build PWA and offline single-file copy
        run: npm run build:all
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # anonymous usage counts: the GoatCounter site code, set as the repository variable STATS_SITE (empty = none sent)
          STATS_SITE: ${{ vars.STATS_SITE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # tell Bing, Yandex, Seznam and Naver (and through Bing, ChatGPT search and Copilot) that the pages changed
      - name: Announce the pages through IndexNow
        continue-on-error: true
        run: |
          site=https://shipshape.skipjack.app
          urls=$(curl -fsS "$site/site/urls.txt" | jq -R . | jq -sc .)
          curl -fsS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"shipshape.skipjack.app\",\"key\":\"8b8f8d6d1f88d4f02f414e14dbea8c38\",\"keyLocation\":\"$site/8b8f8d6d1f88d4f02f414e14dbea8c38.txt\",\"urlList\":$urls}" \
            -w 'IndexNow: HTTP %{http_code}\n'
